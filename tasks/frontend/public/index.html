<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122b2c">
  <title>Taskflow · 任务调度中心</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview">
      <span class="brand-mark">t<span>f</span></span>
      <span>Taskflow<small>任务调度工作台</small></span>
    </a>
    <div class="workspace"><span class="workspace-icon">T</span>
      <div>默认工作空间<small>Single instance</small></div>
      <span class="workspace-arrow">⌄</span>
    </div>
    <p class="nav-label">工作空间</p>
    <nav aria-label="主导航">
      <a href="#overview" data-page="overview">
        <span class="nav-icon">◫</span>概览<span class="nav-end">↗</span>
      </a>
      <a href="#tasks" data-page="tasks">
        <span class="nav-icon">◷</span>定时任务
        <span class="nav-count" id="task-count">0</span>
      </a>
      <a href="#runs" data-page="runs">
        <span class="nav-icon">≡</span>运行记录
      </a>
      <a href="#channels" data-page="channels">
        <span class="nav-icon">♧</span>通知渠道
      </a>
      <a href="#plugins" data-page="plugins">
        <span class="nav-icon">⊞</span>插件目录
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="engine-status"><span class="dot"></span>
        <div id="connection-status">正在连接<small>Go 调度引擎</small></div>
      </div>
      <div class="sidebar-footer">TASKFLOW <span>v1.0</span></div>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <div class="breadcrumb">工作空间 <span>/</span> 调度中心</div>
      <div class="topbar-tools">
        <label class="search-box"><span>⌕</span>
          <input id="search" placeholder="搜索任务…" aria-label="搜索任务">
          <kbd>/</kbd>
        </label>
        <button class="icon-button" id="auth-button" title="退出登录"
          aria-label="退出登录">⚿</button>
        <span class="avatar">TF</span>
      </div>
    </header>
    <main id="main" aria-live="polite">
      <div class="loading">正在连接调度引擎…</div>
    </main>
    <footer class="page-footer">
      <span>让每一次执行，都有迹可循。</span>
      <span id="last-refresh">LOCAL WORKSPACE · GO ENGINE</span>
    </footer>
  </div>
  <dialog id="editor" class="editor-dialog">
    <div class="dialog-header">
      <div><span class="eyebrow" id="editor-eyebrow">TASK CONFIGURATION</span>
        <h2 id="editor-title">新建任务</h2></div>
      <button class="icon-button" data-close="editor" aria-label="关闭">×</button>
    </div>
    <form id="editor-form">
      <div id="editor-fields"></div>
      <p class="form-error" id="editor-error" role="alert"></p>
      <div class="dialog-footer">
        <span>配置保存后立即生效</span>
        <div><button type="button" class="button secondary"
          data-close="editor">取消</button>
          <button class="button primary" id="save-button">保存配置</button>
        </div>
      </div>
    </form>
  </dialog>
  <dialog id="detail" class="detail-dialog">
    <div class="dialog-header">
      <div><span class="eyebrow">EXECUTION DETAIL</span>
        <h2>执行详情</h2></div>
      <button class="icon-button" data-close="detail" aria-label="关闭">×</button>
    </div>
    <div id="detail-body"></div>
  </dialog>
  <div id="toast" role="status"></div>
</body>
</html>
